; TSC Neural Graphics 0.3 (route mouillee v1) : reglages relus a chaud (chaque seconde) pendant que le jeu tourne.
; Ctrl+Maj+G : effet marche/arret. Ctrl+Maj+D : vue de controle suivante. Ctrl+Maj+T : trace d'une image.
actif = 1
; -1 = automatique (pluie detectee par la passe des gouttes du jeu, mouille en mouille_s, seche en seche_s) ; 0..1 = force
humidite = -1
mouille_s = 40
seche_s = 300
seuil_gouttes = 500
; vue : 0 normale, 1 profondeur (bleu ciel, rouge cabine), 2 normales, 3 masque mouille
vue = 0
; camera d'une vue (audit 03/11 : 43 deg vertical, plan proche 0,2 m ; monde 0,01-0,9 dans la profondeur, cabine au-dela)
fov_v = 43
proche = 0.2
plage_min = 0.01
plage_max = 0.9
max_vues = 3
intensite = 1
rugosite = 0.12
trainees = 1.5
pas = 0.12
epaisseur = 0.5
f0 = 0.04
assombrir = 0.35
; route mouillee v1, calee sur les videos reelles de nuit et de pluie :
; flou : largeur du reflet flou (0 = miroir net, 0,25 = comme les videos)
flou = 0.25
; etirement : allongement vertical des reflets de lumieres (videos : hauteur/largeur 2,5 la nuit, 3 sous la pluie, jusqu'a 5)
etirement = 0.8
; peinture : reflet retire sur les marquages au sol (0 = aucun, 1 = marquages mats)
peinture = 0.6
; decalage de la profondeur (mesure sur un vidage reel du 03/11 : -0,000194 ; l'audit donnait +0,000125)
decalage_z = -0.000194
