; TSC Neural Graphics 0.9.3 (route mouillee v1, profileur TSC v1) : reglages relus a chaud (chaque seconde) pendant que le jeu tourne.
; Ctrl+Maj+G : effet marche/arret. Ctrl+Maj+D : vue de controle suivante. Ctrl+Maj+T : trace d'une image.
actif = 1
; -1 = automatique (pluie detectee par la passe des gouttes du jeu, mouille en mouille_s, seche en seche_s) ; 0..1 = force
humidite = -1
mouille_s = 40
seche_s = 300
seuil_gouttes = 500
; vue : 0 normale, 1 profondeur (bleu ciel, rouge cabine), 2 normales, 3 masque mouille
vue = 0
; camera d'une vue (audit 03/11 : 43 deg vertical, plan proche 0,2 m ; monde 0,01-0,9 dans la profondeur, cabine au-dela)
fov_v = 43
proche = 0.2
plage_min = 0.01
plage_max = 0.9
max_vues = 3
intensite = 1
rugosite = 0.12
trainees = 1.5
pas = 0.12
epaisseur = 0.5
f0 = 0.04
assombrir = 0.35
; route mouillee v1, calee sur les videos reelles de nuit et de pluie :
; flou : largeur du reflet flou (0 = miroir net, 0,25 = comme les videos)
flou = 0.25
; etirement : allongement vertical des reflets de lumieres (videos : hauteur/largeur 2,5 la nuit, 3 sous la pluie, jusqu'a 5)
etirement = 0.8
; peinture : reflet retire sur les marquages au sol (0 = aucun, 1 = marquages mats)
peinture = 0.6
; decalage de la profondeur (mesure sur un vidage reel du 03/11 : -0,000194 ; l'audit donnait +0,000125)
decalage_z = -0.000194
; bascule_auto : effet coupe puis active tout seul toutes les N secondes (0 = seulement Ctrl+Maj+G)
bascule_auto = 0
; profil : 1 = profileur TSC v1, une ligne par image dans tsc-profil.csv (temps d'image, temps GPU, dessins, attentes CPU,
;          creations, memoire video), ecrite une fois par seconde ; 0 = pas de CSV (le verdict reste dans tsc-graphics.log)
profil = 1
; taille_min : vues traitees seulement si au moins N x N pixels (ignore les sondes de reflets 256x128 vues au test T1)
taille_min = 512
; trace : changer ce nombre (1, 2, 3...) = trace d'une image ecrite dans tsc-graphics-trace.log, sans touche
trace = 0
; ---- camera v1 (0.5) : rendu facon camera reelle, cale sur les videos (0 = coupe ; tout se regle a chaud) ----
; camera : intensite globale de la couche camera (0 a 1)
camera = 1
; brouillard : voile du lointain (perspective aerienne)
brouillard = 0
; diffusion : halo des lumieres fortes (optique)
diffusion = 0.3
; grain : grain de capteur
grain = 0.012
; sat_hautes : saturation des hautes lumieres (videos : bien plus que le jeu)
sat_hautes = 0
; ext_desat : le lointain se delave
ext_desat = 0.1
; ombres : ombres de contact (~0,5 m), occlusion ambiante (~2 m) et lumiere indirecte, depuis la profondeur reelle
ombres = 0.8
; ---- 0.6 : modes, budget, ambiances, eau sur vitre ----
; mode : 2 = photorealisme optimise (tout, sous budget), 1 = performance extreme (route mouillee legere, sans ombres,
;        grain ni eau sur vitre), 0 = personnalise (valeurs ci-dessus telles quelles, pas de budget)
mode = 2
; budget_ms : temps GPU maximum accorde a TSC par image ; au-dela la qualite baisse toute seule (0,4 a 1), puis remonte
budget_ms = 4
; ambiance_auto : 1 = reglages jour / nuit / pluie choisis d'apres la lumiere de la scene ; nuit_lum / jour_lum a caler en jeu
ambiance_auto = 1
nuit_lum = 0.02
jour_lum = 0.25
; vitre : eau sur le pare-brise en vue cabine, SEULEMENT quand le jeu fait pleuvoir (0.7) ; gouttes_taille : taille des gouttes
vitre = 1
gouttes_taille = 1
; ---- 0.7 : photo (le test T2 montrait une image presque inchangee) ----
; devoile : retire la brume claire que le jeu ajoute avec la distance (0 = brume du jeu, 1 = fort)
devoile = 0.5
; clarte : contraste local, le relief des videos reelles
clarte = 0.12
; noirs : ombres plus profondes, hautes lumieres conservees
noirs = 0.08
; chaleur : soleil chaud, ombres froides (de jour)
chaleur = 0.12
; vegetation : feuillage moins criard, plus profond, translucide au soleil (masque du feuillage du G-buffer)
vegetation = 0.6
; ---- 0.8 : calage sur les videos reelles (T3 : image trop sombre, noirs bouches, vegetation jaune, route brune) ----
; exposition : multiplie toute l'image HDR (1 = jeu)
exposition = 1
; gamma_monde : eclaircit les tons sombres et moyens (0 = rien, negatif = assombrit)
gamma_monde = 0.1
; hautes : hautes lumieres plus hautes (le reel monte bien plus haut que le jeu)
hautes = 0.35
; saturation : saturation globale (1 = inchangee)
saturation = 1
; veg_teinte : feuillage vers le bleu-vert (contre le jaune-olive)
veg_teinte = 0.6
; neutre : retire la dominante brune des surfaces grises (route, beton, glissieres), d'apres l'albedo du G-buffer
neutre = 0.5
; ---- 0.9 : etage APRES l'exposition automatique et le tone mapping du jeu (avant l'interface) ----
; (en HDR, l'exposition automatique du jeu annulait l'exposition TSC ; ici elle reste a l'ecran)
; ldr : 1 = actif
ldr = 1
; ldr_expo : exposition finale (reel jour : image plus claire que le jeu)
ldr_expo = 1.5
; ldr_contraste : contraste autour du gris moyen (1 = inchange)
ldr_contraste = 1
; ldr_epaule : debut de la compression douce des blancs (0,6-0,95)
ldr_epaule = 0.75
; ldr_sat : saturation globale
ldr_sat = 0.88
; ldr_sat_hautes : saturation des zones claires (negatif = moins ; le jeu est plus sature que le reel)
ldr_sat_hautes = -0.3
; ldr_temperature : + chaud, - froid ; ldr_teinte : + vert, - magenta
ldr_temperature = 0
ldr_teinte = 0
; ldr_noirs : point noir (+ = noirs plus profonds)
ldr_noirs = 0
; ldr_verts : desature et eclaircit les verts jaunes trop vifs de la vegetation du jeu
ldr_verts = 0.4
; ldr_lut : force de la table de couleurs apprise sur les videos reelles (fichier tsc-graphics-lut.bin a cote de la DLL ;
;           absent = rien ; relu a chaud quand il change)
ldr_lut = 1
; enregistre : TSC Neural, donnees d'entrainement. Changer ce nombre (ex. 50) = 50 images du jeu SANS effet, une toutes les 2 s,
;              dans plugins\tsc_neural (hdr, profondeur, albedo+feuillage, image 8 bits du jeu, pour chacun des 3 ecrans)
enregistre = 0
; 0.17 : enr_effet = 1 : l image enregistree (jeu8) est celle que TSC Neural recoit en jeu (apres les effets TSC du monde)
enr_effet = 0
; 0.17 : enr_jeu8_seul = 1 : seule l image jeu8 est enregistree (16 Mo par jeu au lieu de ~112 Mo)
enr_jeu8_seul = 0
; sonde_textures : 0.10 TSC Textures etape 1 = RELEVE des textures chargees par le jeu (empreinte, taille, format) dans tsc-textures.csv.
; Rien n'est remplace. 0 = coupe. Plafond 40 000 lignes (~3 Mo).
sonde_textures = 1
; vider_textures : 0.12, extraction des textures de decor (niveau 0, .dds nomme par empreinte) dans plugins\tsc_textures_brut,
; pour fabriquer le cache HD. Nombre = Mo maximum (ex. 3000). 0 = coupe. Usage prive.
vider_textures = 0
; textures_hd : 0.13, remplacement a la volee par plugins\tsc_textures_hd\<empreinte>.dds (meme format que le jeu, ou RGBA8/R8/R8G8 equivalent,
; meme proportions, plus grand ou egal). 1 = marche, 0 = textures du jeu (instantane).
textures_hd = 1
; hd_budget_mo : 0.13.1, memoire video maximale des textures HD en Mo (au-dela, la texture du jeu est gardee).
; Formats HD acceptes : BC1/BC3/BC7 (meme espace sRGB, BC1 seulement si le jeu est en BC1), BC4, BC5, ou non compresse.
hd_budget_mo = 6000

; ---------- 0.14 : TSC Meteo (a chaud) ----------
; meteo : 1 = marche, 0 = coupe tout. L'ambiance pluie suit la pluie du jeu (passe des gouttes) : montee en pluie_montee_s, fin en pluie_fin_s.
; Pour essayer sans pluie : humidite = 1 force la route mouillee ET l'ambiance pluie (-1 = automatique).
meteo = 1
; brume au sol : force (0 = coupee), hauteur de la couche (m), hauteur de l'oeil au-dessus de la route (m, cabine de camion ~2,6)
brume_sol = 0.5
brume_hauteur = 6
oeil = 2.6
; rideau de pluie : force, vitesse de chute (1 = ~9 m/s), inclinaison (vent)
rideau = 0.6
pluie_vitesse = 1
pluie_incl = 0.15
; ciel de pluie : nuages sombres qui defilent ; monde sous la pluie : delavage, froid, contraste (<1 = plus doux)
nuages = 0.5
pluie_delave = 0.25
pluie_froid = 0.3
pluie_contraste = 0.9
pluie_montee_s = 15
pluie_fin_s = 90
; table de couleurs de pluie (tsc-graphics-lut-pluie.bin, apprise sur les videos de pluie) : force du melange sous la pluie
ldr_lut_pluie = 1
; ---------- 0.14.2 : optique (a chaud) ----------
; optique : douceur d'objectif, retire le pique de synthese (micro-contraste du jeu bien au-dessus du reel), plus fort au loin. 0 = coupe, essais 0.3 / 0.6
optique = 0
; ---------- 0.15 : les 3 ameliorations du juge v2 (a chaud, 0 = coupe) ----------
; anticrenelage : bords adoucis apres tone mapping (0 a 1, essais 0.5 / 1)
anticrenelage = 0
; air : perspective aerienne physique (transmission de l'air + lumiere du ciel a l'horizon) ; visibilite : distance (m) ou le contraste tombe a 2 %
air = 0
visibilite = 6000
; ao_horizons : occlusion par horizons orientee par la normale (remplace l'ancienne occlusion quand > 0 ; essais 0.6 / 0.9)
ao_horizons = 0
; ---------- 0.15.1 : moins de relances du jeu ----------
; textures_relister : changer ce nombre (1, 2, 3...) relit le dossier tsc_textures_hd sans relancer le jeu
textures_relister = 0
; libre1 a libre12 : reglages reserves aux prochains effets (seul le HLSL changera, recharge a chaud)
libre1 = 0
libre2 = 0
libre3 = 0
libre4 = 0
libre5 = 0
libre6 = 0
libre7 = 0
libre8 = 0
libre9 = 0
libre10 = 0   ; 0.17 : TSC Neural, 0 = detail fin du jeu garde (reseau sur image adoucie), 1 = ancien mode
libre11 = 0   ; 0.17 : 0 = TSC Neural remplace la chaine ldr (melange avec l image brute), 1 = sa correction s ajoute a la chaine ldr
libre12 = 0
