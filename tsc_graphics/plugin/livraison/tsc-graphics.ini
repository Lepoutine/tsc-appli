; TSC Neural Graphics 0.1 : reglages relus a chaud (chaque seconde) pendant que le jeu tourne.
; Ctrl+Maj+G : effet marche/arret. Ctrl+Maj+D : vue de controle suivante. Ctrl+Maj+T : trace d'une image.
actif = 1
; 0 = sec, 1 = route mouillee
humidite = 1
; vue : 0 normale, 1 profondeur, 2 normales, 3 masque mouille (force la vue si different de 0)
vue = 0
; camera : a caler en jeu avec la vue 1 et 2 (le sol doit etre vert-bleu uni en vue 2)
fov_v = 55
proche = 0.1
loin = 5000
; -1 = detecte (effacement a 0 => Z inverse)
z_inverse = -1
; 1 = une seule image, 2 = deux ecrans rendus cote a cote avec chacun sa camera
ecrans = 1
intensite = 1
rugosite = 0.15
trainees = 1.5
cabine_m = 2.5
pas = 0.15
epaisseur = 0.6
f0 = 0.04
assombrir = 0.35
; 0 = copie de la profondeur avant son effacement (sinon a Present), 1 = a Present seulement
copie = 0
